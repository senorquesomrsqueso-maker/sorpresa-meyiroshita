<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un Universo Para Ti ✨</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Nunito:wght@300;400;700&display=swap');

        body { margin: 0; padding: 0; overflow: hidden; background: #010103; font-family: 'Nunito', sans-serif; user-select: none; color: white; }
        #game-canvas { width: 100vw; height: 100vh; position: absolute; z-index: 1; }

        /* Pantalla de Inicio */
        #start-screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle at center, #0a0a1a 0%, #000 100%); z-index: 200; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; transition: opacity 2s ease; }
        #start-screen h1 { font-family: 'Cinzel', serif; font-size: 4em; color: #4facfe; text-shadow: 0 0 30px rgba(79,172,254,0.8); margin-bottom: 10px; }
        #start-screen p { font-size: 1.2em; color: #cbd5e1; max-width: 600px; line-height: 1.6; margin-bottom: 40px; }
        .btn-start { background: transparent; border: 2px solid #4facfe; color: #4facfe; padding: 15px 50px; font-size: 1.5em; font-family: 'Cinzel', serif; border-radius: 30px; cursor: pointer; transition: all 0.4s; text-transform: uppercase; letter-spacing: 3px; }
        .btn-start:hover { background: #4facfe; color: #000; box-shadow: 0 0 40px #4facfe; transform: scale(1.05); }

        /* HUD */
        .hud { position: absolute; top: 30px; left: 30px; z-index: 10; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); padding: 20px; border-radius: 15px; border-left: 4px solid #00f2fe; box-shadow: 0 0 20px rgba(0,242,254,0.2); transition: opacity 1s; opacity: 0; }
        .hud h2 { margin: 0 0 10px 0; font-family: 'Cinzel', serif; color: #fff; font-size: 1.5em; text-transform: uppercase; letter-spacing: 2px; }
        .hud p { margin: 0; color: #a0aec0; font-size: 1.1em; }
        #hud-world { color: #ff9a9e; font-weight: bold; }

        .controls { position: absolute; bottom: 30px; right: 30px; z-index: 10; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 10px; text-align: right; color: #cbd5e1; opacity: 0; transition: opacity 1s; }
        .controls span { color: #4facfe; font-weight: bold; }

        /* Modales */
        .modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9); width: 90%; max-width: 700px; background: rgba(5,5,15,0.95); padding: 50px; border-radius: 20px; border: 1px solid #4facfe; z-index: 100; opacity: 0; pointer-events: none; transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 30px rgba(79,172,254,0.3); text-align: center; }
        .modal.active { opacity: 1; pointer-events: all; transform: translate(-50%, -50%) scale(1); }
        .modal h1 { font-family: 'Cinzel', serif; color: #ff9a9e; font-size: 2.2em; margin-top: 0; text-shadow: 0 0 15px rgba(255,154,158,0.5); }
        .modal p { font-size: 1.2em; line-height: 1.8; color: #e2e8f0; text-align: justify; margin-bottom: 30px; }
        .btn-continue { background: linear-gradient(45deg, #4facfe, #00f2fe); border: none; padding: 15px 40px; color: white; font-size: 1.2em; font-weight: bold; border-radius: 30px; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 20px rgba(0,242,254,0.3); }
        .btn-continue:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(0,242,254,0.6); }

        #flash { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: white; z-index: 150; opacity: 0; pointer-events: none; transition: opacity 3s; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="start-screen">
        <h1>El Universo de Meyiroshira</h1>
        <p>Iniciando conexión con los servidores del corazón...<br>Asegúrate de tener el volumen encendido para la experiencia completa.</p>
        <button class="btn-start" onclick="startGame()">Conectar</button>
    </div>

    <div class="hud" id="main-hud">
        <h2>Proyecto Eternidad</h2>
        <p>Mundo Actual: <span id="hud-world">El Abismo Dorado</span></p>
        <p>Fragmentos de Amor: <span id="score" style="color: #00f2fe; font-weight: bold;">0</span> / 4</p>
    </div>

    <div class="controls" id="main-controls">
        Mover: <span>[W A S D]</span><br>
        Doble Salto: <span>[Espacio x2]</span><br>
        Sprint: <span>[Shift]</span>
    </div>

    <div id="flash"></div>

    <div class="modal" id="msg-modal">
        <h1 id="msg-title"></h1>
        <p id="msg-text"></p>
        <button class="btn-continue" onclick="closeMsg()">Seguir Avanzando</button>
    </div>

    <div id="game-canvas"></div>

    <script>
        // --- AUDIO ---
        const audioGolden = new Audio('golden.mp3');
        audioGolden.loop = true;
        audioGolden.volume = 0; 

        const audioImpostor = new Audio('impostor.mp3');
        audioImpostor.loop = true;
        audioImpostor.volume = 0;

        function fadeAudio(audioIn, audioOut) {
            audioIn.play();
            let volIn = 0;
            let volOut = audioOut ? audioOut.volume : 0;
            
            const fadeInterval = setInterval(() => {
                if (volIn < 0.6) { volIn += 0.02; audioIn.volume = volIn; }
                if (audioOut && volOut > 0) { volOut -= 0.02; audioOut.volume = Math.max(0, volOut); }
                
                if (volIn >= 0.6 && (!audioOut || volOut <= 0)) {
                    if (audioOut) audioOut.pause();
                    clearInterval(fadeInterval);
                }
            }, 100);
        }

        // --- MOTOR 3D OPTIMIZADO ---
        const container = document.getElementById('game-canvas');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x010103, 0.012);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true }); // Antialias false mejora mucho el FPS
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.2)); // Optimizado para pantallas
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // --- ILUMINACIÓN ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const playerLight = new THREE.PointLight(0x00f2fe, 1.5, 40);
        scene.add(playerLight);

        const directionalLight = new THREE.DirectionalLight(0xff9a9e, 1.2);
        directionalLight.position.set(50, 100, -50);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 1024; // Sombras optimizadas
        directionalLight.shadow.mapSize.height = 1024;
        scene.add(directionalLight);

        // --- PARTÍCULAS OPTIMIZADAS ---
        const particleCount = 1500; // Drástica reducción para evitar LAG
        const particleGeo = new THREE.BufferGeometry();
        const particlePos = new Float32Array(particleCount * 3);
        const particleColors = new Float32Array(particleCount * 3);

        const color1 = new THREE.Color(0x4facfe);
        const color2 = new THREE.Color(0xff9a9e);

        for(let i=0; i < particleCount; i++) {
            particlePos[i*3] = (Math.random() - 0.5) * 400;
            particlePos[i*3+1] = (Math.random() - 0.5) * 400;
            particlePos[i*3+2] = (Math.random() - 0.5) * 400;

            const mixedColor = color1.clone().lerp(color2, Math.random());
            particleColors[i*3] = mixedColor.r;
            particleColors[i*3+1] = mixedColor.g;
            particleColors[i*3+2] = mixedColor.b;
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
        particleGeo.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));

        const particleMat = new THREE.PointsMaterial({ size: 1.5, vertexColors: true, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
        const particleSystem = new THREE.Points(particleGeo, particleMat);
        scene.add(particleSystem);

        // --- JUGADOR ---
        const playerGeo = new THREE.SphereGeometry(1, 16, 16); // Geometría reducida
        const playerMat = new THREE.MeshPhongMaterial({ color: 0xffffff, emissive: 0x00f2fe, emissiveIntensity: 0.5 });
        const player = new THREE.Mesh(playerGeo, playerMat);
        player.position.set(0, 5, 0);
        player.castShadow = true;
        scene.add(player);

        const physics = {
            velocity: new THREE.Vector3(),
            gravity: -0.015,
            speed: 0.12,
            maxSpeed: 0.4,
            jumpForce: 0.4,
            jumpsLeft: 2,
            isGrounded: false
        };

        const keys = { w: false, a: false, s: false, d: false, space: false, shift: false };
        let spacePressed = false;

        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if(keys.hasOwnProperty(key)) keys[key] = true;
            if(e.code === 'Space') keys.space = true;
            if(e.code === 'ShiftLeft' || e.code === 'ShiftRight') keys.shift = true;

            if(e.code === 'Space' && !spacePressed && !gamePaused) {
                spacePressed = true;
                if(physics.jumpsLeft > 0) {
                    physics.velocity.y = physics.jumpForce;
                    physics.jumpsLeft--;
                    physics.isGrounded = false;
                }
            }
        });
        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if(keys.hasOwnProperty(key)) keys[key] = false;
            if(e.code === 'Space') { keys.space = false; spacePressed = false; }
            if(e.code === 'ShiftLeft' || e.code === 'ShiftRight') keys.shift = false;
        });

        // --- MUNDOS OPTIMIZADOS ---
        const platforms = [];
        const memories = [];
        const worldGroup1 = new THREE.Group();
        const worldGroup2 = new THREE.Group();
        scene.add(worldGroup1);
        worldGroup2.position.set(0, -300, -200);
        scene.add(worldGroup2);

        const platMat = new THREE.MeshPhongMaterial({ color: 0x111122, shininess: 10 });
        
        function createPlatform(x, y, z, w, d, group) {
            const geo = new THREE.BoxGeometry(w, 2, d);
            const mesh = new THREE.Mesh(geo, platMat);
            mesh.position.set(x, y, z);
            mesh.receiveShadow = true;
            
            const edges = new THREE.EdgesGeometry(geo);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x4facfe, transparent: true, opacity: 0.3 }));
            mesh.add(line);
            
            group.add(mesh);
            platforms.push({ mesh, w, d, yTop: y + 1 });
        }

        // Mundo 1
        createPlatform(0, 0, 0, 15, 15, worldGroup1);
        createPlatform(0, -2, -20, 8, 8, worldGroup1);
        createPlatform(15, 2, -35, 10, 10, worldGroup1);
        createPlatform(30, 5, -50, 12, 12, worldGroup1);
        createPlatform(20, 10, -75, 8, 8, worldGroup1);
        createPlatform(0, 15, -90, 15, 15, worldGroup1);
        createPlatform(-20, 20, -110, 10, 10, worldGroup1);
        createPlatform(-40, 22, -130, 8, 8, worldGroup1);
        createPlatform(-60, 30, -160, 20, 20, worldGroup1);

        const memoryData = [
            { pos: [15, 4, -35], title: "El Primer Mes", text: "El inicio de nuestra odisea. Descubrimos que nuestras mentes operaban en el mismo servidor. Me di cuenta de que mi vida era mucho mejor si tú estabas conectada." },
            { pos: [0, 17, -90], title: "El Segundo Mes", text: "La conexión se hizo inquebrantable. A pesar de las distancias y los obstáculos del mapa, demostramos que nuestro dúo está hecho para ganar cualquier partida." },
            { pos: [-40, 24, -130], title: "El Tercer Mes", text: "Oficialmente 3 meses a tu lado. Has sido mi soporte, mi luz en las noches más largas y la razón de mi sonrisa frente a la pantalla. Eres mi mundo entero." },
            { pos: [-60, 33, -160], title: "El Gran Salto", text: "Has recolectado nuestra historia. Ahora, prepárate para entrar a nuestro rincón especial. Salta hacia la luz dorada y confía en mí.", isPortal: true }
        ];

        const memGeo = new THREE.OctahedronGeometry(1.5);
        const memMat = new THREE.MeshPhongMaterial({ color: 0xffd700, emissive: 0xffaa00, emissiveIntensity: 0.8, wireframe: true });

        memoryData.forEach((data) => {
            const mesh = new THREE.Mesh(memGeo, memMat);
            mesh.position.set(data.pos[0], data.pos[1], data.pos[2]);
            worldGroup1.add(mesh);
            memories.push({ mesh, data, collected: false });
        });

        // Mundo 2 (Ajedrez)
        const tileSize = 20;
        for(let r=0; r<8; r++) {
            for(let c=0; c<8; c++) {
                const isWhite = (r + c) % 2 === 0;
                const mat = new THREE.MeshPhongMaterial({ 
                    color: isWhite ? 0xffffff : 0x050510, 
                    emissive: isWhite ? 0x222222 : 0x000000
                });
                const tile = new THREE.Mesh(new THREE.BoxGeometry(tileSize, 4, tileSize), mat);
                tile.position.set((c - 3.5) * tileSize, 0, (r - 3.5) * tileSize);
                tile.receiveShadow = true;
                worldGroup2.add(tile);
                platforms.push({ mesh: tile, w: tileSize, d: tileSize, yTop: 2 });
            }
        }
        
        const kingGeo = new THREE.CylinderGeometry(3, 5, 25, 16);
        const queenGeo = new THREE.CylinderGeometry(2.5, 6, 28, 16);
        
        const kingMat = new THREE.MeshPhongMaterial({ color: 0x111111, emissive: 0xff0044, emissiveIntensity: 0.4 });
        const queenMat = new THREE.MeshPhongMaterial({ color: 0xffffff, emissive: 0x00f2fe, emissiveIntensity: 0.6 });

        const king = new THREE.Mesh(kingGeo, kingMat);
        king.position.set(-30, 14.5, -40);
        worldGroup2.add(king);

        const queen = new THREE.Mesh(queenGeo, queenMat);
        queen.position.set(30, 16, -40);
        worldGroup2.add(queen);

        // --- LÓGICA DE JUEGO ---
        let gamePaused = true;
        let score = 0;
        let currentWorld = 1;

        function startGame() {
            document.getElementById('start-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('main-hud').style.opacity = '1';
                document.getElementById('main-controls').style.opacity = '1';
                gamePaused = false;
                fadeAudio(audioGolden, null);
            }, 2000);
        }

        function openMessage(data) {
            gamePaused = true;
            physics.velocity.set(0,0,0);
            document.getElementById('msg-title').innerText = data.title;
            document.getElementById('msg-text').innerText = data.text;
            
            if(data.isPortal) {
                document.querySelector('.btn-continue').innerText = "Saltar al Tablero de Ajedrez";
                document.querySelector('.btn-continue').onclick = transitionToWorld2;
            } else {
                document.querySelector('.btn-continue').innerText = "Seguir Avanzando";
                document.querySelector('.btn-continue').onclick = closeMsg;
            }
            
            document.getElementById('msg-modal').classList.add('active');
        }

        function closeMsg() {
            document.getElementById('msg-modal').classList.remove('active');
            setTimeout(() => { gamePaused = false; }, 300);
        }

        function transitionToWorld2() {
            document.getElementById('msg-modal').classList.remove('active');
            document.getElementById('flash').style.opacity = '1'; 
            
            fadeAudio(audioImpostor, audioGolden);

            setTimeout(() => {
                currentWorld = 2;
                document.getElementById('hud-world').innerText = "El Tablero de Ajedrez";
                document.getElementById('hud-world').style.color = "#a855f7";
                
                player.position.set(0, -260, -100); 
                physics.velocity.set(0,0,0);
                
                document.getElementById('flash').style.opacity = '0';
                gamePaused = false;
                
                setTimeout(showFinalLetter, 8000);
            }, 3000);
        }

        const finalLetter = `Mi amada Reina Blanca, Meyiroshira...\n\nLlegamos al final de este recorrido. Quería construir algo inmenso, un código gigante que demostrara que mi amor por ti no cabe en un mensaje de texto normal, ni en un solo servidor.\n\nAún recuerdo cómo me ganas siempre en Ajedrez, este espacio es significativo pues representa algo importante para ti, pero allí plasmamos todo lo que nos diste, ¿sabes?\n\nHan sido 3 meses donde mi mundo cambió de color. Donde cada bloque de código, cada partida y cada madrugada llevan tu nombre impreso. Eres el sistema operativo de mi corazón, la jugada perfecta que nunca vi venir pero que salvó mi partida entera.\n\nPrometo seguir cuidándote, seguir desvelándome contigo, seguir perdiendo en el ajedrez con tal de ver tu victoria, y amarte con toda el alma. ¡Feliz Aniversario mi Reina! ❤️`;

        function showFinalLetter() {
            gamePaused = true;
            document.getElementById('msg-title').innerText = "El Jaque Mate de mi Vida";
            document.getElementById('msg-title').style.color = "#a855f7";
            document.getElementById('msg-text').innerHTML = finalLetter.replace(/\n/g, '<br>');
            document.querySelector('.btn-continue').innerText = "Te Amo Infinitamente";
            document.querySelector('.btn-continue').onclick = () => {
                document.getElementById('msg-modal').classList.remove('active');
                gamePaused = false;
            };
            document.getElementById('msg-modal').classList.add('active');
        }

        // Variables Globales Reutilizables (Anti-LAG de Recolección de Basura)
        const upVector = new THREE.Vector3(0, 1, 0);
        const camDir = new THREE.Vector3();
        const camRight = new THREE.Vector3();
        const globPos = new THREE.Vector3();
        const targetCamPos = new THREE.Vector3();

        // --- BUCLE PRINCIPAL ---
        function animate() {
            requestAnimationFrame(animate);

            if(!gamePaused) {
                let currentSpeed = keys.shift ? physics.maxSpeed : physics.speed;
                let moveX = 0, moveZ = 0;
                
                // Cálculo de direcciones reutilizando vectores globales
                camera.getWorldDirection(camDir);
                camDir.y = 0; 
                camDir.normalize();
                camRight.crossVectors(camDir, upVector).normalize();

                if(keys.w) { moveX += camDir.x * currentSpeed; moveZ += camDir.z * currentSpeed; }
                if(keys.s) { moveX -= camDir.x * currentSpeed; moveZ -= camDir.z * currentSpeed; }
                if(keys.a) { moveX -= camRight.x * currentSpeed; moveZ -= camRight.z * currentSpeed; }
                if(keys.d) { moveX += camRight.x * currentSpeed; moveZ += camRight.z * currentSpeed; }

                physics.velocity.x = moveX;
                physics.velocity.z = moveZ;
                physics.velocity.y += physics.gravity;

                player.position.add(physics.velocity);

                physics.isGrounded = false;
                const px = player.position.x;
                const pz = player.position.z;
                const py = player.position.y - 1; 

                let highestFloor = -9999;
                
                platforms.forEach(p => {
                    p.mesh.getWorldPosition(globPos);
                    const minX = globPos.x - p.w/2 - 0.5;
                    const maxX = globPos.x + p.w/2 + 0.5;
                    const minZ = globPos.z - p.d/2 - 0.5;
                    const maxZ = globPos.z + p.d/2 + 0.5;

                    if (px >= minX && px <= maxX && pz >= minZ && pz <= maxZ) {
                        const floorY = globPos.y + p.yTop;
                        if(py <= floorY && py >= floorY - 2.0) {
                            if(floorY > highestFloor) highestFloor = floorY;
                        }
                    }
                });

                if(highestFloor !== -9999 && physics.velocity.y <= 0) {
                    player.position.y = highestFloor + 1;
                    physics.velocity.y = 0;
                    physics.isGrounded = true;
                    physics.jumpsLeft = 2; 
                }

                if(player.position.y < (currentWorld === 1 ? -50 : -350)) {
                    if(currentWorld === 1) player.position.set(0, 5, 0);
                    else player.position.set(0, -280, -100);
                    physics.velocity.set(0,0,0);
                }

                if(currentWorld === 1) {
                    memories.forEach((m) => {
                        m.mesh.rotation.y += 0.02;
                        m.mesh.rotation.z += 0.01;
                        if(!m.collected) {
                            if(player.position.distanceTo(m.mesh.position) < 2.5) {
                                m.collected = true;
                                scene.remove(m.mesh);
                                score++;
                                document.getElementById('score').innerText = score;
                                openMessage(m.data);
                            }
                        }
                    });
                }
            } 

            particleSystem.rotation.y += 0.0005;
            king.rotation.y += 0.005;
            queen.rotation.y -= 0.005;

            // Seguimiento de cámara
            targetCamPos.set(player.position.x, player.position.y + 10, player.position.z + 25);
            camera.position.lerp(targetCamPos, 0.05);
            camera.lookAt(player.position.x, player.position.y, player.position.z);
            
            playerLight.position.copy(player.position);
            playerLight.position.y += 2;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
