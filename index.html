<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Un Universo Para Ti ✨ - Tercer Aniversario</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Nunito:wght@300;400;700&display=swap');

        body { margin: 0; padding: 0; overflow: hidden; background: #010103; font-family: 'Nunito', sans-serif; user-select: none; color: white; touch-action: none; }
        #game-canvas { width: 100vw; height: 100vh; position: absolute; z-index: 1; }

        #start-screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: #0a0a1a; z-index: 200; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; transition: opacity 1s ease; }
        #start-screen h1 { font-family: 'Cinzel', serif; font-size: 2.8em; color: #4facfe; margin-bottom: 10px; padding: 0 20px; text-shadow: 0 0 15px rgba(79, 172, 254, 0.5);}
        #start-screen p { font-size: 1.1em; color: #cbd5e1; max-width: 90%; margin-bottom: 30px; }
        .btn-start { background: #000; border: 2px solid #4facfe; color: #4facfe; padding: 12px 40px; font-size: 1.2em; font-family: 'Cinzel', serif; border-radius: 30px; cursor: pointer; text-transform: uppercase; box-shadow: 0 0 15px rgba(79, 172, 254, 0.3); transition: all 0.3s; }
        .btn-start:active { transform: scale(0.95); }
        
        .hud { position: absolute; top: 15px; left: 15px; z-index: 10; background: rgba(5,5,15,0.85); padding: 15px; border-radius: 12px; border-left: 3px solid #00f2fe; box-shadow: 0 4px 15px rgba(0,0,0,0.5); opacity: 0; transition: opacity 1s; }
        .hud h2 { margin: 0 0 5px 0; font-family: 'Cinzel', serif; color: #fff; font-size: 1.2em; text-shadow: 0 0 5px rgba(255,255,255,0.3); }
        .hud p { margin: 0; color: #a0aec0; font-size: 0.9em; font-weight: bold;}

        .controls { position: absolute; bottom: 15px; right: 15px; z-index: 10; background: rgba(0,0,0,0.6); padding: 12px; border-radius: 10px; text-align: right; color: #cbd5e1; opacity: 0; font-size: 0.85em; border-right: 2px solid #4facfe; }
        .controls span { color: #4facfe; font-weight: bold; }

        .modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9); width: 90%; max-width: 550px; background: rgba(5,5,18,0.97); padding: 40px; border-radius: 20px; border: 2px solid #ff9a9e; z-index: 100; opacity: 0; pointer-events: none; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); text-align: center; box-shadow: 0 0 40px rgba(255,154,158,0.4); max-height: 85vh; overflow-y: auto; }
        .modal.active { opacity: 1; pointer-events: all; transform: translate(-50%, -50%) scale(1); }
        .modal h1 { font-family: 'Cinzel', serif; color: #ff9a9e; font-size: 2em; margin-top: 0; text-shadow: 0 0 10px rgba(255, 154, 158, 0.5); }
        .modal p { font-size: 1.1em; line-height: 1.7; color: #e2e8f0; margin-bottom: 25px; text-align: left; white-space: pre-line; }
        .btn-continue { background: linear-gradient(45deg, #ff9a9e, #4facfe); border: none; padding: 14px 40px; color: #000; font-weight: bold; font-size: 1.1em; border-radius: 25px; cursor: pointer; transition: transform 0.2s; box-shadow: 0 0 15px rgba(255,154,158,0.5); }
        .btn-continue:active { transform: scale(0.95); }

        #flash { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: white; z-index: 150; opacity: 0; pointer-events: none; transition: opacity 1.5s; }

        #joystick-zone { display: none; position: absolute; bottom: 25px; left: 25px; width: 130px; height: 130px; background: rgba(255,255,255,0.05); border: 2px solid rgba(79,172,254,0.3); border-radius: 50%; z-index: 50; touch-action: none; opacity: 0; transition: opacity 1s; }
        #joystick-handle { position: absolute; top: 35px; left: 35px; width: 60px; height: 60px; background: rgba(79,172,254,0.4); border: 2px solid #4facfe; border-radius: 50%; pointer-events: none; transition: transform 0.05s linear; }

        #action-controls { display: none; position: absolute; bottom: 35px; right: 25px; z-index: 50; opacity: 0; transition: opacity 1s; }
        .action-btn { width: 75px; height: 75px; background: rgba(255,154,158,0.2); border: 2px solid rgba(255,154,158,0.5); border-radius: 50%; color: white; font-weight: bold; display: flex; align-items: center; justify-content: center; user-select: none; backdrop-filter: blur(2px); font-family: 'Cinzel', serif; font-size: 0.9em; }
        .action-btn:active { background: rgba(255,154,158,0.7); transform: scale(0.9); box-shadow: 0 0 15px #ff9a9e; }

        @media (max-width: 768px) {
            .controls { display: none; } 
            #joystick-zone { display: block; }
            #action-controls { display: block; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="start-screen">
        <h1>El Universo de Meyiroshira</h1>
        <p>Sincronizando mundos separados (Avión y Parkour)...<br>Sube el volumen y prepárate.</p>
        <button class="btn-start" onclick="startGame()">Conectar</button>
    </div>

    <div class="hud" id="main-hud">
        <h2>Proyecto Eternidad</h2>
        <p>Mundo: <span id="hud-world" style="color: #4facfe;">El Abismo Dorado</span></p>
        <p>Fragmentos Estelares: <span id="easter-score" style="color: #ffd700;">0</span> / 6</p>
    </div>

    <div class="controls" id="main-controls">
        Mover: <span>[W A S D]</span><br>
        Doble Salto: <span>[Espacio x2]</span>
    </div>

    <div id="joystick-zone">
        <div id="joystick-handle"></div>
    </div>
    <div id="action-controls">
        <div class="action-btn" id="btn-jump">SALTAR</div>
    </div>

    <div id="flash"></div>

    <div class="modal" id="msg-modal">
        <h1 id="msg-title"></h1>
        <p id="msg-text"></p>
        <button class="btn-continue" onclick="closeMsg()">Seguir</button>
    </div>

    <div id="game-canvas"></div>

    <script>
        const audioGolden = new Audio('golden.mp3');
        audioGolden.loop = true; audioGolden.volume = 0; 
        const audioImpostor = new Audio('impostor.mp3');
        audioImpostor.loop = true; audioImpostor.volume = 0;

        function fadeAudio(audioIn, audioOut) {
            audioIn.play().catch(e => console.log("Audio interceptado"));
            let volIn = 0, volOut = audioOut ? audioOut.volume : 0;
            const fade = setInterval(() => {
                if(volIn < 0.5) { volIn += 0.05; audioIn.volume = Math.min(volIn, 0.5); }
                if(audioOut && volOut > 0) { volOut -= 0.05; audioOut.volume = Math.max(0, volOut); }
                if(volIn >= 0.5 && (!audioOut || volOut <= 0)) {
                    if(audioOut) audioOut.pause();
                    clearInterval(fade);
                }
            }, 100);
        }

        const container = document.getElementById('game-canvas');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x010103, 0.010);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 900);
        const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true, powerPreference: "high-performance" }); 
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        container.appendChild(renderer.domElement);

        const planetGeo = new THREE.SphereGeometry(15, 16, 16);
        const planetMat = new THREE.MeshBasicMaterial({ color: 0xff9a9e, wireframe: true });
        const bgPlanet = new THREE.Mesh(planetGeo, planetMat);
        bgPlanet.position.set(60, -400, -100);
        scene.add(bgPlanet);

        function createParticles(colorHex, count, size) {
            const pGeo = new THREE.BufferGeometry();
            const pPos = new Float32Array(count * 3);
            for(let i=0; i<count; i++) {
                pPos[i*3] = (Math.random() - 0.5) * 500;
                pPos[i*3+1] = (Math.random() - 0.5) * 2000;
                pPos[i*3+2] = (Math.random() - 0.5) * 500;
            }
            pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
            const pMat = new THREE.PointsMaterial({ color: colorHex, size: size, transparent: true, opacity: 0.6 });
            const pSys = new THREE.Points(pGeo, pMat);
            scene.add(pSys);
            return pSys;
        }
        const particlesCyan = createParticles(0x4facfe, 400, 1.8);
        const particlesPink = createParticles(0xff9a9e, 350, 1.5);
        const particlesGold = createParticles(0xffd700, 250, 2.0);

        const playerGeo = new THREE.SphereGeometry(1, 10, 10); 
        const playerMat = new THREE.MeshBasicMaterial({ color: 0x00f2fe, wireframe: true }); 
        const player = new THREE.Mesh(playerGeo, playerMat);
        player.position.set(0, 5, 0);
        scene.add(player);

        const physics = { vel: new THREE.Vector3(), grav: -0.015, speed: 0.18, jumpForce: 0.38, jumps: 2 };
        const keys = { w: false, a: false, s: false, d: false };
        let moveDir = { x: 0, z: 0 };
        let easterEggsFound = 0;

        function handleJump(e) {
            if(e) e.preventDefault();
            if(!gamePaused && physics.jumps > 0) {
                physics.vel.y = physics.jumpForce;
                physics.jumps--;
            }
        }

        window.addEventListener('keydown', e => {
            const k = e.key.toLowerCase();
            if(keys.hasOwnProperty(k)) keys[k] = true;
            if(e.code === 'Space') handleJump(e);
        });
        window.addEventListener('keyup', e => {
            const k = e.key.toLowerCase();
            if(keys.hasOwnProperty(k)) keys[k] = false;
        });

        const joystickZone = document.getElementById('joystick-zone');
        const joystickHandle = document.getElementById('joystick-handle');
        let joystickTouchId = null;
        let joystickCenter = { x: 0, y: 0 };

        joystickZone.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.changedTouches[0];
            joystickTouchId = touch.identifier;
            const rect = joystickZone.getBoundingClientRect();
            joystickCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
        }, {passive: false});

        joystickZone.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for(let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if(touch.identifier === joystickTouchId) {
                    let dx = touch.clientX - joystickCenter.x;
                    let dy = touch.clientY - joystickCenter.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const maxDist = 45;
                    if(dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
                    joystickHandle.style.transform = `translate(${dx}px, ${dy}px)`;
                    moveDir.x = dx / maxDist;
                    moveDir.z = dy / maxDist;
                }
            }
        }, {passive: false});

        const endJoystick = (e) => {
            for(let i = 0; i < e.changedTouches.length; i++) {
                if(e.changedTouches[i].identifier === joystickTouchId) {
                    joystickTouchId = null;
                    joystickHandle.style.transform = `translate(0px, 0px)`;
                    moveDir.x = 0; moveDir.z = 0;
                }
            }
        };
        joystickZone.addEventListener('touchend', endJoystick);
        joystickZone.addEventListener('touchcancel', endJoystick);

        const btnJump = document.getElementById('btn-jump');
        btnJump.addEventListener('touchstart', (e) => { e.preventDefault(); handleJump(e); }, {passive: false});

        const platforms = [];
        const memories = [];
        const easterEggs = [];
        const worldGroup = new THREE.Group(); 
        scene.add(worldGroup);

        function createPlatDef(x, y, z, w, d, worldId, faceColor = 0x050510, edgeColor = 0x4facfe) {
            const geo = new THREE.BoxGeometry(w, 2, d);
            const mat = new THREE.MeshBasicMaterial({ color: faceColor });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            
            const edges = new THREE.EdgesGeometry(geo);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: edgeColor }));
            mesh.add(line);
            
            mesh.visible = false;
            mesh.scale.set(0.01, 0.01, 0.01);
            worldGroup.add(mesh);
            platforms.push({ mesh, x, y, z, w, d, yTop: y + 1, active: false, world: worldId });
            return mesh;
        }

        // MUNDO 1: Parkour Inicial
        createPlatDef(0, 0, 0, 15, 15, 1); 
        createPlatDef(0, -2, -15, 12, 12, 1); 
        createPlatDef(12, 1, -28, 12, 12, 1); 
        createPlatDef(20, 5, -40, 10, 10, 1); 
        createPlatDef(10, 9, -52, 10, 10, 1); 
        createPlatDef(0, 13, -65, 15, 15, 1); 
        createPlatDef(-15, 17, -78, 12, 12, 1); 
        createPlatDef(-30, 20, -95, 18, 18, 1); 

        // MUNDO 2: Paseo Estelar
        createPlatDef(0, -250, 0, 18, 18, 2, 0x0a0a1a, 0xff9a9e);
        createPlatDef(0, -248, -18, 14, 14, 2, 0x0a0a1a, 0xff9a9e);
        createPlatDef(10, -246, -36, 14, 14, 2, 0x0a0a1a, 0xff9a9e);
        createPlatDef(-10, -244, -54, 14, 14, 2, 0x0a0a1a, 0xff9a9e);
        createPlatDef(0, -242, -72, 20, 20, 2, 0x0a0a1a, 0xff9a9e);

        // MUNDO 3: Pasaje Cósmico
        createPlatDef(0, -500, 0, 20, 20, 3, 0x05101a, 0x00f2fe);
        createPlatDef(0, -498, -20, 14, 14, 3, 0x05101a, 0x00f2fe);
        createPlatDef(0, -496, -40, 14, 14, 3, 0x05101a, 0x00f2fe);
        createPlatDef(0, -494, -60, 20, 20, 3, 0x05101a, 0x00f2fe);

        // MUNDO 4: Arcade Ascendente
        createPlatDef(0, -750, 0, 16, 16, 4, 0x1a0a1a, 0xa855f7);
        createPlatDef(8, -746, -15, 12, 12, 4, 0x1a0a1a, 0xa855f7);
        createPlatDef(-8, -742, -30, 12, 12, 4, 0x1a0a1a, 0xa855f7);
        createPlatDef(0, -738, -45, 18, 18, 4, 0x1a0a1a, 0xa855f7);

        // MUNDO 5: Mundo del Avión (Vuelo vertical hacia arriba)
        createPlatDef(0, -1000, 0, 25, 6, 5, 0x002244, 0x00ffff); // Ala del avión base
        createPlatDef(0, -990, -15, 12, 20, 5, 0x003366, 0x00ffff); // Cuerpo principal del avión
        createPlatDef(0, -975, -15, 10, 10, 5, 0x004488, 0x00ffff); // Escala de vuelo intermedia del avión
        createPlatDef(0, -955, -15, 8, 8, 5, 0x0055aa, 0x00ffff); // Zona alta del vuelo del avión
        createPlatDef(0, -935, -15, 14, 14, 5, 0x002244, 0x00ffff); // Plataforma culminante del avión

        // MUNDO 6: Mundo de Parkour Extremo (Adicional separado)
        createPlatDef(0, -1150, 0, 12, 12, 6, 0x330033, 0xff00ff);
        createPlatDef(10, -1145, -18, 8, 8, 6, 0x330033, 0xff00ff);
        createPlatDef(-10, -1140, -36, 8, 8, 6, 0x330033, 0xff00ff);
        createPlatDef(12, -1135, -54, 7, 7, 6, 0x330033, 0xff00ff);
        createPlatDef(0, -1130, -72, 14, 14, 6, 0x440044, 0xff00ff);

        // MUNDO 7: Tablero Real con Carta Gigante
        const tileSize = 20;
        for(let r=0; r<6; r++) {
            for(let c=0; c<6; c++) {
                const isW = (r + c) % 2 === 0;
                createPlatDef((c - 2.5) * tileSize, -1350, (r - 2.5) * tileSize, tileSize, tileSize, 7, isW ? 0xdddddd : 0x111111, isW ? 0x555555 : 0x4facfe);
            }
        }

        // MUNDO 8: MUNDO SECRETO (Cofre Final del Aniversario - Desbloqueado con los 6 Fragmentos)
        createPlatDef(0, -1600, 0, 22, 22, 8, 0x1a001a, 0xff00ff);
        createPlatDef(0, -1596, -25, 15, 15, 8, 0x1a001a, 0xff00ff);

        // Memorias y Portales de transición
        const memData = [
            { world: 1, pos: [12, 3, -28], title: "El Primer Mes", text: "Descubrimos que nuestras mentes operaban en el mismo servidor. Mi vida mejoró al instante." },
            { world: 1, pos: [0, 15, -65], title: "El Segundo Mes", text: "Demostramos que nuestro dúo está hecho para ganar cualquier partida." },
            { world: 1, pos: [-15, 19, -78], title: "El Tercer Mes", text: "Eres mi soporte y la razón de mi sonrisa frente a la pantalla." },
            { world: 1, pos: [-30, 22, -95], title: "El Gran Salto", text: "Prepárate para entrar a nuestro rincón especial.", isPortal: 2 },
            
            { world: 2, pos: [0, -240, -72], title: "Camino Estelar", text: "A veces, caminar a tu lado es la mayor aventura.", isPortal: 3 },
            
            { world: 3, pos: [0, -490, -60], title: "Constelación de Amor", text: "Cada estrella representa un momento feliz juntos.", isPortal: 4 },
            
            { world: 4, pos: [0, -734, -45], title: "Nivel Superado: Arcade Ascendente", text: "Subiendo cada escalón de la vida juntos.", isPortal: 5 },

            { world: 5, pos: [0, -930, -15], title: "El Mundo del Avión", text: "✈️ ¡Has completado el vuelo vertical del avión hacia las alturas con éxito!", isPortal: 6 },

            { world: 6, pos: [0, -1125, -72], title: "Mundo de Parkour Extremo", text: "🧗‍♂️ ¡Has superado todos los saltos de precisión en el mundo adicional de parkour!", isPortal: 7 },
            
            { world: 7, pos: [0, -1347, 0], title: "Jaque Mate de mi Vida (Carta Gigante)", text: "Mi amada Meyiroshira...\n\nQuería construir un código que demostrara que mi amor por ti no cabe en un mensaje normal.\n\nHan sido 3 meses maravillosos donde mi mundo cambió por completo. Eres el sistema operativo de mi corazón, la jugada perfecta en esta partida llamada vida.\n\nPrometo seguir perdiendo en ajedrez con tal de ver tu hermosa sonrisa y tu victoria. ¡Feliz Tercer Aniversario mi Reina Blanca! ❤️", isFinal: true, checkSecret: true },

            { world: 8, pos: [0, -1592, -25], title: "Cofre Secreto del Aniversario", text: "✨ ¡Has abierto el cofre secreto definitivo!\n\nEste nivel solo se desbloquea para la jugadora más especial del universo al recolectar todos los fragmentos. ¡Te amo muchísimo!", isSecretFinal: true }
        ];

        const memGeo = new THREE.OctahedronGeometry(1.2, 0); 
        const memM = new THREE.MeshBasicMaterial({ color: 0xffd700, wireframe: true });

        memData.forEach(d => {
            const m = new THREE.Mesh(memGeo, memM);
            m.position.set(d.pos[0], d.pos[1], d.pos[2]);
            m.visible = false; 
            worldGroup.add(m);
            memories.push({ mesh: m, data: d, collected: false });
        });

        // 6 Fragmentos / Estrellas repartidas en los mundos
        const eeData = [
            { world: 2, pos: [10, -243, -36], name: "Fragmento Estelar 1" },
            { world: 3, pos: [0, -491, -40], name: "Fragmento Estelar 2" },
            { world: 4, pos: [-8, -739, -30], name: "Fragmento Estelar 3" },
            { world: 5, pos: [0, -970, -15], name: "Fragmento Estelar 4 (Avión)" },
            { world: 6, pos: [-10, -1136, -36], name: "Fragmento Estelar 5 (Parkour)" },
            { world: 7, pos: [15, -1347, 15], name: "Fragmento Estelar 6 (Ajedrez)" }
        ];
        const eeGeo = new THREE.DodecahedronGeometry(0.8, 0);
        const eeMat = new THREE.MeshBasicMaterial({ color: 0xff00ff, wireframe: true });

        eeData.forEach(e => {
            const m = new THREE.Mesh(eeGeo, eeMat);
            m.position.set(e.pos[0], e.pos[1], e.pos[2]);
            m.visible = false;
            worldGroup.add(m);
            easterEggs.push({ mesh: m, data: e, collected: false });
        });

        let gamePaused = true, currentWorld = 1, highestPlatIndex = 0;

        function startGame() {
            document.getElementById('start-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('main-hud').style.opacity = '1';
                document.getElementById('main-controls').style.opacity = '1';
                document.getElementById('joystick-zone').style.opacity = '1';
                document.getElementById('action-controls').style.opacity = '1';
                fadeAudio(audioGolden, null);
                loadWorld(1);
            }, 1000);
        }

        function activatePlatform(index) {
            if(platforms[index] && !platforms[index].active && platforms[index].world === currentWorld) {
                platforms[index].active = true;
                platforms[index].mesh.visible = true;
            }
        }

        function loadWorld(worldId) {
            currentWorld = worldId;
            highestPlatIndex = 0;
            physics.vel.set(0,0,0);
            gamePaused = false;

            platforms.forEach((p, idx) => {
                if(p.world === worldId) {
                    if (worldId === 1) {
                        p.active = false; p.mesh.visible = false;
                        if(idx === 0 || idx === 1) activatePlatform(idx);
                    } else {
                        p.active = true; p.mesh.visible = true; p.mesh.scale.set(0.01, 0.01, 0.01);
                    }
                } else {
                    p.active = false; p.mesh.visible = false;
                }
            });

            memories.forEach(m => {
                m.collected = false;
                m.mesh.visible = (m.data.world === worldId);
            });

            easterEggs.forEach(e => {
                e.mesh.visible = (e.data.world === worldId && !e.collected);
            });

            if(worldId === 1) player.position.set(0, 5, 0);
            else if(worldId === 2) player.position.set(0, -245, 0);
            else if(worldId === 3) player.position.set(0, -495, 0);
            else if(worldId === 4) player.position.set(0, -745, 0);
            else if(worldId === 5) player.position.set(0, -995, 0); // Mundo Avión (inicio abajo subiendo)
            else if(worldId === 6) player.position.set(0, -1145, 0); // Mundo Parkour
            else if(worldId === 7) player.position.set(0, -1345, 30); // Tablero Real
            else if(worldId === 8) player.position.set(0, -1595, 0); // Mundo Secreto Cofre Final

            const names = ["", "El Abismo Dorado", "El Paseo Estelar", "Pasaje Cósmico", "Arcade Ascendente", "Mundo del Avión", "Mundo de Parkour Extremo", "El Tablero Real", "✨ Mundo Secreto: Cofre Final ✨"];
            document.getElementById('hud-world').innerText = names[worldId];
            camera.position.set(player.position.x, player.position.y + 7, player.position.z + 18);
        }

        function openMsg(data) {
            gamePaused = true; 
            physics.vel.set(0,0,0);
            document.getElementById('msg-title').innerText = data.title;
            
            let textToShow = data.text;
            document.getElementById('msg-text').innerHTML = textToShow.replace(/\n/g, '<br>');
            
            const btn = document.querySelector('.btn-continue');
            if(data.isPortal) {
                btn.innerText = "Siguiente Nivel";
                btn.onclick = () => transitionToWorld(data.isPortal);
            } else if(data.checkSecret && easterEggsFound === 6) {
                btn.innerText = "🔓 Entrar al Mundo Secreto del Cofre";
                btn.onclick = () => transitionToWorld(8);
            } else {
                btn.innerText = "Seguir";
                btn.onclick = () => { document.getElementById('msg-modal').classList.remove('active'); setTimeout(()=>gamePaused=false, 200); };
            }
            document.getElementById('msg-modal').classList.add('active');
        }

        function transitionToWorld(worldId) {
            document.getElementById('msg-modal').classList.remove('active');
            document.getElementById('flash').style.opacity = '1'; 
            if (worldId >= 7) fadeAudio(audioImpostor, audioGolden);

            setTimeout(() => {
                loadWorld(worldId);
                document.getElementById('flash').style.opacity = '0';
            }, 1500);
        }

        function animate() {
            requestAnimationFrame(animate);

            platforms.forEach(p => {
                if(p.active && p.mesh.scale.x < 1) p.mesh.scale.lerp(new THREE.Vector3(1,1,1), 0.1);
            });

            if(!gamePaused) {
                let mX = 0, mZ = 0;
                if(keys.w) mZ -= physics.speed;
                if(keys.s) mZ += physics.speed;
                if(keys.a) mX -= physics.speed;
                if(keys.d) mX += physics.speed;

                if(Math.abs(moveDir.x) > 0.05 || Math.abs(moveDir.z) > 0.05) {
                    mX = moveDir.x * physics.speed;
                    mZ = moveDir.z * physics.speed;
                }

                player.position.x += mX;
                player.position.z += mZ;
                physics.vel.x = mX; physics.vel.z = mZ;

                let oldY = player.position.y;
                physics.vel.y += physics.grav;
                player.position.y += physics.vel.y;

                let floorY = -9999;
                let landedIndex = -1;

                platforms.forEach((p, i) => {
                    if(!p.active || p.world !== currentWorld) return;
                    const marginX = (p.w / 2) + 1.2;
                    const marginZ = (p.d / 2) + 1.2;
                    
                    if (Math.abs(player.position.x - p.x) <= marginX && Math.abs(player.position.z - p.z) <= marginZ) {
                        const top = p.yTop;
                        if (oldY - 1.0 >= top - 1.0 && player.position.y - 1.0 <= top + 0.5) {
                            if (top > floorY) { floorY = top; landedIndex = i; }
                        }
                    }
                });

                if (floorY !== -9999 && physics.vel.y <= 0) {
                    player.position.y = floorY + 1.0;
                    physics.vel.y = 0;
                    physics.jumps = 2; 
                    if (currentWorld === 1 && landedIndex >= highestPlatIndex) {
                        highestPlatIndex = landedIndex;
                        activatePlatform(highestPlatIndex + 1);
                        activatePlatform(highestPlatIndex + 2); 
                    }
                }

                let voidLimit = -40;
                if(currentWorld === 2) voidLimit = -280;
                if(currentWorld === 3) voidLimit = -530;
                if(currentWorld === 4) voidLimit = -780;
                if(currentWorld === 5) voidLimit = -1030;
                if(currentWorld === 6) voidLimit = -1180;
                if(currentWorld === 7) voidLimit = -1380;
                if(currentWorld === 8) voidLimit = -1630;

                if(player.position.y < voidLimit) {
                    loadWorld(currentWorld);
                }

                memories.forEach(m => {
                    m.mesh.rotation.y += 0.03;
                    if(m.data.world === currentWorld && m.mesh.visible && !m.collected) {
                        if(player.position.distanceTo(m.mesh.position) < 3.5) {
                            m.collected = true; m.mesh.visible = false;
                            openMsg(m.data);
                        }
                    }
                });

                easterEggs.forEach(e => {
                    e.mesh.rotation.y += 0.05;
                    if(e.data.world === currentWorld && e.mesh.visible && !e.collected) {
                        if(player.position.distanceTo(e.mesh.position) < 3.0) {
                            e.collected = true; e.mesh.visible = false;
                            easterEggsFound++;
                            document.getElementById('easter-score').innerText = easterEggsFound;
                        }
                    }
                });
            }

            particlesCyan.rotation.y += 0.0005;
            particlesPink.rotation.y -= 0.0005;
            particlesGold.rotation.y += 0.001;
            bgPlanet.rotation.y += 0.002;
            
            let targetCamX = player.position.x;
            let targetCamY = player.position.y + 7;
            let targetCamZ = player.position.z + 18;

            camera.position.lerp(new THREE.Vector3(targetCamX, targetCamY, targetCamZ), 0.08);
            camera.lookAt(player.position.x, player.position.y + 2, player.position.z - 5);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
