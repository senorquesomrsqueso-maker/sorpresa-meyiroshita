<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Un Universo Para Ti ✨</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Nunito:wght@300;400;700&display=swap');

        body { margin: 0; padding: 0; overflow: hidden; background: #010103; font-family: 'Nunito', sans-serif; user-select: none; color: white; touch-action: none; }
        #game-canvas { width: 100vw; height: 100vh; position: absolute; z-index: 1; }

        /* Pantalla de Inicio */
        #start-screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: #0a0a1a; z-index: 200; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; transition: opacity 1s ease; }
        #start-screen h1 { font-family: 'Cinzel', serif; font-size: 3em; color: #4facfe; margin-bottom: 10px; padding: 0 20px; text-shadow: 0 0 15px rgba(79, 172, 254, 0.5);}
        #start-screen p { font-size: 1.1em; color: #cbd5e1; max-width: 90%; margin-bottom: 30px; }
        .btn-start { background: #000; border: 2px solid #4facfe; color: #4facfe; padding: 12px 40px; font-size: 1.2em; font-family: 'Cinzel', serif; border-radius: 30px; cursor: pointer; text-transform: uppercase; box-shadow: 0 0 15px rgba(79, 172, 254, 0.3); transition: all 0.3s; }
        .btn-start:active { transform: scale(0.95); }
        
        /* HUD */
        .hud { position: absolute; top: 15px; left: 15px; z-index: 10; background: rgba(5,5,15,0.85); padding: 15px; border-radius: 12px; border-left: 3px solid #00f2fe; box-shadow: 0 4px 15px rgba(0,0,0,0.5); opacity: 0; transition: opacity 1s; }
        .hud h2 { margin: 0 0 5px 0; font-family: 'Cinzel', serif; color: #fff; font-size: 1.2em; text-shadow: 0 0 5px rgba(255,255,255,0.3); }
        .hud p { margin: 0; color: #a0aec0; font-size: 0.9em; font-weight: bold;}

        .controls { position: absolute; bottom: 15px; right: 15px; z-index: 10; background: rgba(0,0,0,0.6); padding: 12px; border-radius: 10px; text-align: right; color: #cbd5e1; opacity: 0; font-size: 0.85em; border-right: 2px solid #4facfe; }
        .controls span { color: #4facfe; font-weight: bold; }

        /* Modales */
        .modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9); width: 85%; max-width: 450px; background: rgba(5,5,15,0.95); padding: 35px; border-radius: 15px; border: 1px solid #4facfe; z-index: 100; opacity: 0; pointer-events: none; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); text-align: center; box-shadow: 0 0 30px rgba(79,172,254,0.3); }
        .modal.active { opacity: 1; pointer-events: all; transform: translate(-50%, -50%) scale(1); }
        .modal h1 { font-family: 'Cinzel', serif; color: #ff9a9e; font-size: 1.8em; margin-top: 0; text-shadow: 0 0 10px rgba(255, 154, 158, 0.4); }
        .modal p { font-size: 1.05em; line-height: 1.6; color: #e2e8f0; margin-bottom: 25px; }
        .btn-continue { background: linear-gradient(45deg, #4facfe, #00f2fe); border: none; padding: 12px 35px; color: #000; font-weight: bold; font-size: 1.1em; border-radius: 25px; cursor: pointer; transition: transform 0.2s; box-shadow: 0 0 15px rgba(79,172,254,0.4); }
        .btn-continue:active { transform: scale(0.95); }

        #flash { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: white; z-index: 150; opacity: 0; pointer-events: none; transition: opacity 1.5s; }

        /* CONTROLES MÓVILES */
        #mobile-controls { display: none; position: absolute; bottom: 25px; left: 25px; z-index: 50; width: 140px; height: 140px; opacity: 0; transition: opacity 1s; }
        .dpad-row { display: flex; justify-content: center; width: 100%; height: 33%; }
        .dpad-btn { width: 45px; height: 45px; background: rgba(79,172,254,0.15); border: 1px solid rgba(79,172,254,0.4); border-radius: 12px; color: white; font-weight: bold; display: flex; align-items: center; justify-content: center; user-select: none; backdrop-filter: blur(2px); }
        .dpad-btn:active { background: rgba(79,172,254,0.7); box-shadow: 0 0 10px #4facfe; }

        #action-controls { display: none; position: absolute; bottom: 35px; right: 25px; z-index: 50; opacity: 0; transition: opacity 1s; }
        .action-btn { width: 65px; height: 65px; background: rgba(255,154,158,0.15); border: 2px solid rgba(255,154,158,0.4); border-radius: 50%; color: white; font-weight: bold; display: flex; align-items: center; justify-content: center; user-select: none; backdrop-filter: blur(2px); }
        .action-btn:active { background: rgba(255,154,158,0.7); transform: scale(0.9); box-shadow: 0 0 10px #ff9a9e; }

        @media (max-width: 768px) {
            .controls { display: none; } 
            #mobile-controls { display: flex; flex-direction: column; }
            #action-controls { display: block; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="start-screen">
        <h1>El Universo de Meyiroshira</h1>
        <p>Conectando servidores...<br>Sube el volumen y prepárate para saltar.</p>
        <button class="btn-start" onclick="startGame()">Conectar</button>
    </div>

    <div class="hud" id="main-hud">
        <h2>Proyecto Eternidad</h2>
        <p>Mundo: <span id="hud-world" style="color: #4facfe;">El Abismo Dorado</span></p>
    </div>

    <div class="controls" id="main-controls">
        Mover: <span>[W A S D]</span><br>
        Doble Salto: <span>[Espacio x2]</span>
    </div>

    <div id="mobile-controls">
        <div class="dpad-row"><div class="dpad-btn" id="btn-w">W</div></div>
        <div class="dpad-row" style="justify-content: space-between;">
            <div class="dpad-btn" id="btn-a">A</div>
            <div class="dpad-btn" id="btn-s">S</div>
            <div class="dpad-btn" id="btn-d">D</div>
        </div>
    </div>
    <div id="action-controls">
        <div class="action-btn" id="btn-jump">JUMP</div>
    </div>

    <div id="flash"></div>

    <div class="modal" id="msg-modal">
        <h1 id="msg-title"></h1>
        <p id="msg-text"></p>
        <button class="btn-continue" onclick="closeMsg()">Seguir</button>
    </div>

    <div id="game-canvas"></div>

    <script>
        // --- AUDIO ---
        const audioGolden = new Audio('golden.mp3');
        audioGolden.loop = true; audioGolden.volume = 0; 
        const audioImpostor = new Audio('impostor.mp3');
        audioImpostor.loop = true; audioImpostor.volume = 0;

        function fadeAudio(audioIn, audioOut) {
            audioIn.play().catch(e => console.log("Audio interceptado por el navegador"));
            let volIn = 0, volOut = audioOut ? audioOut.volume : 0;
            const fade = setInterval(() => {
                if(volIn < 0.5) { volIn += 0.05; audioIn.volume = Math.min(volIn, 0.5); }
                if(audioOut && volOut > 0) { volOut -= 0.05; audioOut.volume = Math.max(0, volOut); }
                if(volIn >= 0.5 && (!audioOut || volOut <= 0)) {
                    if(audioOut) audioOut.pause();
                    clearInterval(fade);
                }
            }, 100);
        }

        // --- MOTOR 3D ---
        const container = document.getElementById('game-canvas');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x010103, 0.012);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 800);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" }); 
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
        container.appendChild(renderer.domElement);

        // --- PARTÍCULAS DOBLES (Azul y Rosa) ---
        function createParticles(colorHex, count, size) {
            const pGeo = new THREE.BufferGeometry();
            const pPos = new Float32Array(count * 3);
            for(let i=0; i<count; i++) {
                pPos[i*3] = (Math.random() - 0.5) * 400;
                pPos[i*3+1] = (Math.random() - 0.5) * 400;
                pPos[i*3+2] = (Math.random() - 0.5) * 400;
            }
            pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
            const pMat = new THREE.PointsMaterial({ color: colorHex, size: size, transparent: true, opacity: 0.6 });
            const pSys = new THREE.Points(pGeo, pMat);
            scene.add(pSys);
            return pSys;
        }
        const particlesCyan = createParticles(0x4facfe, 400, 1.5);
        const particlesPink = createParticles(0xff9a9e, 300, 1.2);

        // --- JUGADOR ---
        const playerGeo = new THREE.SphereGeometry(1, 12, 12); 
        const playerMat = new THREE.MeshBasicMaterial({ color: 0x00f2fe, wireframe: true }); 
        const player = new THREE.Mesh(playerGeo, playerMat);
        player.position.set(0, 5, 0);
        scene.add(player);

        const physics = { vel: new THREE.Vector3(), grav: -0.015, speed: 0.18, jumpForce: 0.38, jumps: 2 };
        const keys = { w: false, a: false, s: false, d: false };
        let spacePressed = false;

        function handleJump() {
            if(!spacePressed && !gamePaused && physics.jumps > 0) {
                spacePressed = true;
                physics.vel.y = physics.jumpForce;
                physics.jumps--;
            }
        }

        window.addEventListener('keydown', e => {
            const k = e.key.toLowerCase();
            if(keys.hasOwnProperty(k)) keys[k] = true;
            if(e.code === 'Space') handleJump();
        });
        window.addEventListener('keyup', e => {
            const k = e.key.toLowerCase();
            if(keys.hasOwnProperty(k)) keys[k] = false;
            if(e.code === 'Space') spacePressed = false;
        });

        // Controles Táctiles
        const bindTouch = (id, key) => {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; }, {passive: false});
            el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; }, {passive: false});
        };
        bindTouch('btn-w', 'w'); bindTouch('btn-s', 's');
        bindTouch('btn-a', 'a'); bindTouch('btn-d', 'd');
        
        const btnJump = document.getElementById('btn-jump');
        btnJump.addEventListener('touchstart', (e) => { e.preventDefault(); handleJump(); }, {passive: false});
        btnJump.addEventListener('touchend', (e) => { e.preventDefault(); spacePressed = false; }, {passive: false});

        // --- SISTEMA DE PLATAFORMAS Y MUNDOS ---
        const platforms = [];
        const memories = [];
        const worldGroup = new THREE.Group(); 
        scene.add(worldGroup);

        function createPlatDef(x, y, z, w, d, worldId, faceColor = 0x050510, edgeColor = 0x4facfe) {
            const geo = new THREE.BoxGeometry(w, 2, d);
            const mat = new THREE.MeshBasicMaterial({ color: faceColor });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            
            const edges = new THREE.EdgesGeometry(geo);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: edgeColor }));
            mesh.add(line);
            
            mesh.visible = false;
            mesh.scale.set(0.01, 0.01, 0.01);
            worldGroup.add(mesh);
            
            // x, y, z se guardan para la colisión matemática (más rápida y precisa)
            platforms.push({ mesh, x, y, z, w, d, yTop: y + 1, active: false, world: worldId });
            return mesh;
        }

        // MUNDO 1: Parkour (El mismo de tu index)
        createPlatDef(0, 0, 0, 15, 15, 1); // 0 (Spawn)
        createPlatDef(0, -2, -15, 12, 12, 1); // 1
        createPlatDef(12, 1, -28, 12, 12, 1); // 2
        createPlatDef(20, 5, -40, 10, 10, 1); // 3
        createPlatDef(10, 9, -52, 10, 10, 1); // 4
        createPlatDef(0, 13, -65, 15, 15, 1); // 5
        createPlatDef(-15, 17, -78, 12, 12, 1); // 6
        createPlatDef(-30, 20, -95, 18, 18, 1); // 7 (Final Parkour)

        // MUNDO 2: Camino Estelar (Creativo, Hermoso, Sin saltos difíciles)
        // Un puente continuo y brillante
        createPlatDef(0, 0, 0, 20, 25, 2, 0x0a0a1a, 0xff9a9e);
        createPlatDef(0, 0, -25, 20, 25, 2, 0x0a0a1a, 0xff9a9e);
        createPlatDef(0, 0, -50, 20, 25, 2, 0x0a0a1a, 0xff9a9e);
        createPlatDef(0, 0, -75, 25, 30, 2, 0x0a0a1a, 0xff9a9e); // Plataforma final mundo 2

        // MUNDO 3: El Tablero de Ajedrez
        const tileSize = 20;
        for(let r=0; r<6; r++) {
            for(let c=0; c<6; c++) {
                const isW = (r + c) % 2 === 0;
                createPlatDef((c - 2.5) * tileSize, 0, (r - 2.5) * tileSize, tileSize, tileSize, 3, isW ? 0xdddddd : 0x111111, isW ? 0x555555 : 0x4facfe);
            }
        }

        // --- MEMORIAS / FRAGMENTOS ---
        const memData = [
            // MUNDO 1
            { world: 1, pIdx: 2, pos: [12, 3, -28], title: "El Primer Mes", text: "Descubrimos que nuestras mentes operaban en el mismo servidor. Mi vida mejoró al instante." },
            { world: 1, pIdx: 5, pos: [0, 15, -65], title: "El Segundo Mes", text: "Demostramos que nuestro dúo está hecho para ganar cualquier partida. A pesar del lag de la vida." },
            { world: 1, pIdx: 6, pos: [-15, 19, -78], title: "El Tercer Mes", text: "Eres mi soporte y la razón de mi sonrisa frente a la pantalla." },
            { world: 1, pIdx: 7, pos: [-30, 22, -95], title: "El Gran Salto", text: "Prepárate para entrar a nuestro rincón especial. Confía en mí.", isPortal: 2 },
            
            // MUNDO 2
            { world: 2, pIdx: 3, pos: [0, 3, -75], title: "Camino Estelar", text: "No todo tiene que ser un salto al vacío. A veces, la mayor aventura es simplemente caminar a tu lado hacia el futuro.", isPortal: 3 },
            
            // MUNDO 3
            { world: 3, pIdx: 0, pos: [0, 3, 0], title: "Jaque Mate de mi Vida", text: "Mi amada Meyiroshira...\n\nQuería construir un código que demostrara que mi amor por ti no cabe en un mensaje normal.\n\nHan sido 2 meses donde mi mundo cambió. Eres el sistema operativo de mi corazón, la jugada perfecta.\n\nPrometo seguir perdiendo en ajedrez con tal de ver tu victoria. ¡Feliz Aniversario mi Reina Blanca! ❤️", isFinal: true }
        ];

        const memGeo = new THREE.OctahedronGeometry(1.2, 0); // Diseño estelar
        const memM = new THREE.MeshBasicMaterial({ color: 0xffd700, wireframe: true });

        memData.forEach(d => {
            const m = new THREE.Mesh(memGeo, memM);
            m.position.set(d.pos[0], d.pos[1], d.pos[2]);
            m.visible = false; 
            worldGroup.add(m);
            memories.push({ mesh: m, data: d, collected: false });
        });

        let gamePaused = true, currentWorld = 1, highestPlatIndex = 0;

        function startGame() {
            document.getElementById('start-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('main-hud').style.opacity = '1';
                document.getElementById('main-controls').style.opacity = '1';
                document.getElementById('mobile-controls').style.opacity = '1';
                document.getElementById('action-controls').style.opacity = '1';
                fadeAudio(audioGolden, null);
                loadWorld(1);
            }, 1000);
        }

        function activatePlatform(index) {
            if(platforms[index] && !platforms[index].active && platforms[index].world === currentWorld) {
                platforms[index].active = true;
                platforms[index].mesh.visible = true;
            }
        }

        function loadWorld(worldId) {
            currentWorld = worldId;
            highestPlatIndex = 0;
            physics.vel.set(0,0,0);
            gamePaused = false;

            // Limpiar y configurar plataformas y memorias según el mundo
            platforms.forEach((p, idx) => {
                if(p.world === worldId) {
                    if (worldId === 1) {
                        // En el mundo 1 se activan progresivamente
                        p.active = false; p.mesh.visible = false;
                        if(idx === 0 || idx === 1) activatePlatform(idx);
                    } else {
                        // En mundo 2 y 3 se activa todo el mapa
                        p.active = true; p.mesh.visible = true; p.mesh.scale.set(0.01, 0.01, 0.01);
                    }
                } else {
                    p.active = false; p.mesh.visible = false;
                }
            });

            memories.forEach(m => {
                m.collected = false;
                m.mesh.visible = (m.data.world === worldId);
            });

            if(worldId === 1) {
                player.position.set(0, 5, 0);
                document.getElementById('hud-world').innerText = "El Abismo Dorado";
                document.getElementById('hud-world').style.color = "#00f2fe";
            } else if (worldId === 2) {
                player.position.set(0, 5, 20); // Aparece al inicio del puente
                document.getElementById('hud-world').innerText = "El Paseo Estelar";
                document.getElementById('hud-world').style.color = "#ff9a9e";
            } else if (worldId === 3) {
                player.position.set(0, 10, 30); // Aparece en un borde del tablero
                document.getElementById('hud-world').innerText = "El Tablero";
                document.getElementById('hud-world').style.color = "#a855f7";
            }
            
            // Forzar actualización de cámara sin transición brusca
            camera.position.set(player.position.x, player.position.y + 7, player.position.z + 18);
        }

        function openMsg(data) {
            gamePaused = true; 
            physics.vel.set(0,0,0);
            document.getElementById('msg-title').innerText = data.title;
            document.getElementById('msg-text').innerHTML = data.text.replace(/\n/g, '<br>');
            
            const btn = document.querySelector('.btn-continue');
            if(data.isPortal) {
                btn.innerText = "Siguiente Nivel";
                btn.onclick = () => transitionToWorld(data.isPortal);
            } else if(data.isFinal) {
                btn.innerText = "Te Amo";
                btn.onclick = () => { document.getElementById('msg-modal').classList.remove('active'); gamePaused=false; };
            } else {
                btn.innerText = "Seguir";
                btn.onclick = () => { document.getElementById('msg-modal').classList.remove('active'); setTimeout(()=>gamePaused=false, 200); };
            }
            document.getElementById('msg-modal').classList.add('active');
        }

        function transitionToWorld(worldId) {
            document.getElementById('msg-modal').classList.remove('active');
            document.getElementById('flash').style.opacity = '1'; 
            
            if (worldId === 3) fadeAudio(audioImpostor, audioGolden);

            setTimeout(() => {
                loadWorld(worldId);
                document.getElementById('flash').style.opacity = '0';
            }, 1500);
        }

        // --- BUCLE PRINCIPAL Y FÍSICAS ESTRICTAS ---
        function animate() {
            requestAnimationFrame(animate);

            // Animación de aparición de plataformas
            platforms.forEach(p => {
                if(p.active && p.mesh.scale.x < 1) p.mesh.scale.lerp(new THREE.Vector3(1,1,1), 0.1);
            });

            if(!gamePaused) {
                let mX = 0, mZ = 0;
                if(keys.w) mZ -= physics.speed;
                if(keys.s) mZ += physics.speed;
                if(keys.a) mX -= physics.speed;
                if(keys.d) mX += physics.speed;

                // 1. Aplicar movimiento horizontal
                player.position.x += mX;
                player.position.z += mZ;
                physics.vel.x = mX; 
                physics.vel.z = mZ;

                // 2. Aplicar gravedad y guardar la posición Y anterior
                let oldY = player.position.y;
                physics.vel.y += physics.grav;
                player.position.y += physics.vel.y;

                let floorY = -9999;
                let landedIndex = -1;

                // 3. Sistema de colisión estricto (Anti-traspaso)
                platforms.forEach((p, i) => {
                    if(!p.active || p.world !== currentWorld) return;
                    
                    // Verificación en X y Z (con un pequeño margen de radio de colisión)
                    const marginX = (p.w / 2) + 1.2;
                    const marginZ = (p.d / 2) + 1.2;
                    
                    if (Math.abs(player.position.x - p.x) <= marginX && 
                        Math.abs(player.position.z - p.z) <= marginZ) {
                        
                        const top = p.yTop;
                        
                        // ¿La base del jugador cruzó la superficie de la plataforma en este frame?
                        // (Dando un margen seguro por si la velocidad de caída es muy alta)
                        const oldBase = oldY - 1.0;
                        const newBase = player.position.y - 1.0;
                        
                        if (oldBase >= top - 1.0 && newBase <= top + 0.5) {
                            if (top > floorY) {
                                floorY = top;
                                landedIndex = i;
                            }
                        }
                    }
                });

                // Si hay colisión con el suelo, corregir posición Y
                if (floorY !== -9999 && physics.vel.y <= 0) {
                    player.position.y = floorY + 1.0;
                    physics.vel.y = 0;
                    physics.jumps = 2; // Recargar saltos
                    
                    // Progresión de plataformas (Solo en Mundo 1)
                    if (currentWorld === 1 && landedIndex >= highestPlatIndex) {
                        highestPlatIndex = landedIndex;
                        activatePlatform(highestPlatIndex + 1);
                        activatePlatform(highestPlatIndex + 2); 
                    }
                }

                // Caída al vacío (Reinicio)
                if(player.position.y < -35) {
                    if(currentWorld === 1) player.position.set(0, 5, 0);
                    if(currentWorld === 2) player.position.set(0, 5, 20);
                    if(currentWorld === 3) player.position.set(0, 10, 30);
                    physics.vel.set(0,0,0);
                }

                // Interacción con Memorias
                memories.forEach(m => {
                    m.mesh.rotation.y += 0.05; m.mesh.rotation.x += 0.02;
                    if(m.data.world === currentWorld && m.mesh.visible && !m.collected) {
                        // Rango de recolección seguro (distancia < 3.5)
                        if(player.position.distanceTo(m.mesh.position) < 3.5) {
                            m.collected = true; 
                            m.mesh.visible = false;
                            openMsg(m.data);
                        }
                    }
                });
            }

            // Animación suave de partículas
            particlesCyan.rotation.y += 0.001;
            particlesCyan.rotation.x += 0.0005;
            particlesPink.rotation.y -= 0.001;
            particlesPink.rotation.z += 0.0005;
            
            // --- EFECTO DE CÁMARA (Suave y con Trailing) ---
            let targetCamX = player.position.x;
            let targetCamY = player.position.y + 7;
            let targetCamZ = player.position.z + 18;

            if(Math.abs(physics.vel.x) > 0.01) targetCamX -= physics.vel.x * 25; 
            if(physics.vel.y > 0) targetCamY -= physics.vel.y * 5; 

            camera.position.lerp(new THREE.Vector3(targetCamX, targetCamY, targetCamZ), 0.08);
            camera.lookAt(player.position.x, player.position.y + 2, player.position.z - 5);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
