<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Un Universo Para Ti ✨</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Nunito:wght@300;400;700&display=swap');

        body { margin: 0; padding: 0; overflow: hidden; background: #010103; font-family: 'Nunito', sans-serif; user-select: none; color: white; touch-action: none; }
        #game-canvas { width: 100vw; height: 100vh; position: absolute; z-index: 1; }

        /* Pantalla de Inicio */
        #start-screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: #0a0a1a; z-index: 200; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; transition: opacity 1s ease; }
        #start-screen h1 { font-family: 'Cinzel', serif; font-size: 3em; color: #4facfe; margin-bottom: 10px; padding: 0 20px;}
        #start-screen p { font-size: 1.1em; color: #cbd5e1; max-width: 90%; margin-bottom: 30px; }
        .btn-start { background: #000; border: 2px solid #4facfe; color: #4facfe; padding: 12px 40px; font-size: 1.2em; font-family: 'Cinzel', serif; border-radius: 30px; cursor: pointer; text-transform: uppercase; }
        
        /* HUD */
        .hud { position: absolute; top: 15px; left: 15px; z-index: 10; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 10px; border-left: 3px solid #00f2fe; opacity: 0; transition: opacity 1s; }
        .hud h2 { margin: 0 0 5px 0; font-family: 'Cinzel', serif; color: #fff; font-size: 1.1em; }
        .hud p { margin: 0; color: #a0aec0; font-size: 0.9em; }

        .controls { position: absolute; bottom: 15px; right: 15px; z-index: 10; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 10px; text-align: right; color: #cbd5e1; opacity: 0; font-size: 0.8em; }

        /* Modales */
        .modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9); width: 85%; max-width: 500px; background: rgba(5,5,15,0.98); padding: 30px; border-radius: 15px; border: 1px solid #4facfe; z-index: 100; opacity: 0; pointer-events: none; transition: all 0.3s; text-align: center; }
        .modal.active { opacity: 1; pointer-events: all; transform: translate(-50%, -50%) scale(1); }
        .modal h1 { font-family: 'Cinzel', serif; color: #ff9a9e; font-size: 1.8em; margin-top: 0; }
        .modal p { font-size: 1em; line-height: 1.5; color: #e2e8f0; margin-bottom: 20px; }
        .btn-continue { background: #4facfe; border: none; padding: 12px 30px; color: #000; font-weight: bold; border-radius: 20px; cursor: pointer; }

        #flash { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: white; z-index: 150; opacity: 0; pointer-events: none; transition: opacity 2s; }

        /* CONTROLES MÓVILES */
        #mobile-controls { display: none; position: absolute; bottom: 20px; left: 20px; z-index: 50; width: 150px; height: 150px; opacity: 0; transition: opacity 1s; }
        .dpad-row { display: flex; justify-content: center; width: 100%; height: 33%; }
        .dpad-btn { width: 45px; height: 45px; background: rgba(79,172,254,0.2); border: 1px solid rgba(79,172,254,0.5); border-radius: 10px; color: white; font-weight: bold; display: flex; align-items: center; justify-content: center; user-select: none; }
        .dpad-btn:active { background: rgba(79,172,254,0.6); }

        #action-controls { display: none; position: absolute; bottom: 30px; right: 20px; z-index: 50; opacity: 0; transition: opacity 1s; }
        .action-btn { width: 70px; height: 70px; background: rgba(255,154,158,0.2); border: 2px solid rgba(255,154,158,0.5); border-radius: 50%; color: white; font-weight: bold; display: flex; align-items: center; justify-content: center; user-select: none; }
        .action-btn:active { background: rgba(255,154,158,0.6); transform: scale(0.9); }

        @media (max-width: 768px) {
            .controls { display: none; } 
            #mobile-controls { display: flex; flex-direction: column; }
            #action-controls { display: block; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="start-screen">
        <h1>El Universo de Meyiroshira</h1>
        <p>Conectando servidores...<br>Sube el volumen y prepárate para saltar.</p>
        <button class="btn-start" onclick="startGame()">Conectar</button>
    </div>

    <div class="hud" id="main-hud">
        <h2>Proyecto Eternidad</h2>
        <p>Mundo: <span id="hud-world" style="color: #ff9a9e;">El Abismo Dorado</span></p>
        <p>Fragmentos: <span id="score" style="color: #00f2fe; font-weight: bold;">0</span> / 4</p>
    </div>

    <div class="controls" id="main-controls">
        Mover: <span>[W A S D]</span><br>
        Doble Salto: <span>[Espacio x2]</span>
    </div>

    <div id="mobile-controls">
        <div class="dpad-row"><div class="dpad-btn" id="btn-w">W</div></div>
        <div class="dpad-row" style="justify-content: space-between;">
            <div class="dpad-btn" id="btn-a">A</div>
            <div class="dpad-btn" id="btn-s">S</div>
            <div class="dpad-btn" id="btn-d">D</div>
        </div>
    </div>
    <div id="action-controls">
        <div class="action-btn" id="btn-jump">JUMP</div>
    </div>

    <div id="flash"></div>

    <div class="modal" id="msg-modal">
        <h1 id="msg-title"></h1>
        <p id="msg-text"></p>
        <button class="btn-continue" onclick="closeMsg()">Seguir</button>
    </div>

    <div id="game-canvas"></div>

    <script>
        // --- AUDIO ---
        const audioGolden = new Audio('golden.mp3');
        audioGolden.loop = true; audioGolden.volume = 0; 
        const audioImpostor = new Audio('impostor.mp3');
        audioImpostor.loop = true; audioImpostor.volume = 0;

        function fadeAudio(audioIn, audioOut) {
            audioIn.play().catch(e => console.log("Audio interceptado"));
            let volIn = 0, volOut = audioOut ? audioOut.volume : 0;
            const fade = setInterval(() => {
                if(volIn < 0.5) { volIn += 0.05; audioIn.volume = volIn; }
                if(audioOut && volOut > 0) { volOut -= 0.05; audioOut.volume = Math.max(0, volOut); }
                if(volIn >= 0.5 && (!audioOut || volOut <= 0)) {
                    if(audioOut) audioOut.pause();
                    clearInterval(fade);
                }
            }, 100);
        }

        // --- MOTOR 3D ---
        const container = document.getElementById('game-canvas');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x010103, 0.012);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 800);
        const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true, powerPreference: "high-performance" }); 
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(1); 
        container.appendChild(renderer.domElement);

        // PARTÍCULAS
        const pGeo = new THREE.BufferGeometry();
        const pPos = new Float32Array(300 * 3);
        for(let i=0; i<300; i++) {
            pPos[i*3] = (Math.random() - 0.5) * 300;
            pPos[i*3+1] = (Math.random() - 0.5) * 300;
            pPos[i*3+2] = (Math.random() - 0.5) * 300;
        }
        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        const pMat = new THREE.PointsMaterial({ color: 0x4facfe, size: 2, transparent: true, opacity: 0.5 });
        const particles = new THREE.Points(pGeo, pMat);
        scene.add(particles);

        // --- JUGADOR ---
        const playerGeo = new THREE.SphereGeometry(1, 8, 8); 
        const playerMat = new THREE.MeshBasicMaterial({ color: 0x00f2fe, wireframe: true }); 
        const player = new THREE.Mesh(playerGeo, playerMat);
        player.position.set(0, 5, 0);
        scene.add(player);

        const physics = { vel: new THREE.Vector3(), grav: -0.015, speed: 0.18, jumpForce: 0.38, jumps: 2 };
        const keys = { w: false, a: false, s: false, d: false };
        let spacePressed = false;

        function handleJump() {
            if(!spacePressed && !gamePaused && physics.jumps > 0) {
                spacePressed = true;
                physics.vel.y = physics.jumpForce;
                physics.jumps--;
            }
        }

        window.addEventListener('keydown', e => {
            const k = e.key.toLowerCase();
            if(keys.hasOwnProperty(k)) keys[k] = true;
            if(e.code === 'Space') handleJump();
        });
        window.addEventListener('keyup', e => {
            const k = e.key.toLowerCase();
            if(keys.hasOwnProperty(k)) keys[k] = false;
            if(e.code === 'Space') spacePressed = false;
        });

        // Controles Táctiles
        const bindTouch = (id, key) => {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; }, {passive: false});
            el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; }, {passive: false});
        };
        bindTouch('btn-w', 'w'); bindTouch('btn-s', 's');
        bindTouch('btn-a', 'a'); bindTouch('btn-d', 'd');
        
        const btnJump = document.getElementById('btn-jump');
        btnJump.addEventListener('touchstart', (e) => { e.preventDefault(); handleJump(); }, {passive: false});
        btnJump.addEventListener('touchend', (e) => { e.preventDefault(); spacePressed = false; }, {passive: false});

        // --- MUNDOS Y GENERACIÓN PROGRESIVA ---
        const platforms = [];
        const memories = [];
        const worldGroup1 = new THREE.Group(); scene.add(worldGroup1);
        const worldGroup2 = new THREE.Group(); worldGroup2.position.set(0, -300, -200); scene.add(worldGroup2);
        
        const platMat = new THREE.MeshBasicMaterial({ color: 0x050510 }); 
        const lineMat = new THREE.LineBasicMaterial({ color: 0x4facfe });

        function createPlatDef(x, y, z, w, d, group) {
            const geo = new THREE.BoxGeometry(w, 2, d);
            const mesh = new THREE.Mesh(geo, platMat);
            mesh.position.set(x, y, z);
            
            const edges = new THREE.EdgesGeometry(geo);
            const line = new THREE.LineSegments(edges, lineMat);
            mesh.add(line);
            
            mesh.visible = false;
            mesh.scale.set(0.01, 0.01, 0.01);
            
            group.add(mesh);
            platforms.push({ mesh, w, d, yTop: y + 1, active: false, world: group === worldGroup1 ? 1 : 2 });
            return mesh;
        }

        // DISTANCIAS CORREGIDAS (Más cerca, saltos probados)
        createPlatDef(0, 0, 0, 15, 15, worldGroup1); // 0 (Spawn)
        createPlatDef(0, -2, -15, 12, 12, worldGroup1); // 1
        createPlatDef(12, 1, -28, 12, 12, worldGroup1); // 2
        createPlatDef(20, 5, -40, 10, 10, worldGroup1); // 3
        createPlatDef(10, 9, -52, 10, 10, worldGroup1); // 4
        createPlatDef(0, 13, -65, 15, 15, worldGroup1); // 5
        createPlatDef(-15, 17, -78, 12, 12, worldGroup1); // 6
        createPlatDef(-30, 20, -95, 18, 18, worldGroup1); // 7 (Final)

        const memData = [
            { idx: 2, pos: [12, 3, -28], title: "El Primer Mes", text: "Descubrimos que nuestras mentes operaban en el mismo servidor. Mi vida mejoró al instante." },
            { idx: 5, pos: [0, 15, -65], title: "El Segundo Mes", text: "Demostramos que nuestro dúo está hecho para ganar cualquier partida. A pesar del lag de la vida." },
            { idx: 6, pos: [-15, 19, -78], title: "El Tercer Mes", text: "Eres mi soporte y la razón de mi sonrisa frente a la pantalla." },
            { idx: 7, pos: [-30, 22, -95], title: "El Gran Salto", text: "Prepárate para entrar a nuestro rincón especial. Confía en mí.", isPortal: true }
        ];

        const memGeo = new THREE.BoxGeometry(2, 2, 2); // Fragmentos más grandes
        const memM = new THREE.MeshBasicMaterial({ color: 0xffd700, wireframe: true });

        memData.forEach(d => {
            const m = new THREE.Mesh(memGeo, memM);
            m.position.set(d.pos[0], d.pos[1], d.pos[2]);
            m.visible = false; 
            worldGroup1.add(m);
            memories.push({ mesh: m, data: d, collected: false });
        });

        // Tablero de Ajedrez (Mundo 2)
        const tileSize = 20;
        for(let r=0; r<6; r++) {
            for(let c=0; c<6; c++) {
                const isW = (r + c) % 2 === 0;
                const mat = new THREE.MeshBasicMaterial({ color: isW ? 0xffffff : 0x111111 });
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(tileSize, 2, tileSize), mat);
                mesh.position.set((c - 2.5) * tileSize, 0, (r - 2.5) * tileSize);
                mesh.visible = false;
                mesh.scale.set(0.01,0.01,0.01);
                worldGroup2.add(mesh);
                platforms.push({ mesh, w: tileSize, d: tileSize, yTop: 1, active: false, world: 2 });
            }
        }

        let gamePaused = true, score = 0, currentWorld = 1, highestPlatIndex = 0;

        function startGame() {
            document.getElementById('start-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('main-hud').style.opacity = '1';
                document.getElementById('main-controls').style.opacity = '1';
                document.getElementById('mobile-controls').style.opacity = '1';
                document.getElementById('action-controls').style.opacity = '1';
                gamePaused = false;
                fadeAudio(audioGolden, null);
                activatePlatform(0); activatePlatform(1);
            }, 1000);
        }

        function activatePlatform(index) {
            if(platforms[index] && !platforms[index].active) {
                platforms[index].active = true;
                platforms[index].mesh.visible = true;
                const mem = memories.find(m => m.data.idx === index);
                if(mem) mem.mesh.visible = true;
            }
        }

        function openMsg(data) {
            gamePaused = true; physics.vel.set(0,0,0);
            document.getElementById('msg-title').innerText = data.title;
            document.getElementById('msg-text').innerText = data.text;
            const btn = document.querySelector('.btn-continue');
            if(data.isPortal) {
                btn.innerText = "Saltar al Tablero";
                btn.onclick = transitionWorld2;
            } else {
                btn.innerText = "Seguir";
                btn.onclick = () => { document.getElementById('msg-modal').classList.remove('active'); setTimeout(()=>gamePaused=false, 200); };
            }
            document.getElementById('msg-modal').classList.add('active');
        }

        function transitionWorld2() {
            document.getElementById('msg-modal').classList.remove('active');
            document.getElementById('flash').style.opacity = '1'; 
            fadeAudio(audioImpostor, audioGolden);
            setTimeout(() => {
                currentWorld = 2;
                document.getElementById('hud-world').innerText = "El Tablero";
                document.getElementById('hud-world').style.color = "#a855f7";
                player.position.set(0, -250, -80);
                physics.vel.set(0,0,0);
                platforms.forEach(p => { if(p.world === 2) activatePlatform(platforms.indexOf(p)); });
                document.getElementById('flash').style.opacity = '0';
                gamePaused = false;
                setTimeout(showFinalLetter, 6000);
            }, 2500);
        }

        function showFinalLetter() {
            gamePaused = true;
            document.getElementById('msg-title').innerText = "Jaque Mate de mi Vida";
            document.getElementById('msg-text').innerHTML = "Mi amada Meyiroshira...<br><br>Quería construir un código que demostrara que mi amor por ti no cabe en un mensaje normal.<br><br>Han sido 3 meses donde mi mundo cambió. Eres el sistema operativo de mi corazón, la jugada perfecta.<br><br>Prometo seguir perdiendo en ajedrez con tal de ver tu victoria. ¡Feliz Aniversario mi Reina Blanca! ❤️";
            const btn = document.querySelector('.btn-continue');
            btn.innerText = "Te Amo";
            btn.onclick = () => { document.getElementById('msg-modal').classList.remove('active'); gamePaused=false; };
            document.getElementById('msg-modal').classList.add('active');
        }

        // --- BUCLE PRINCIPAL ---
        const pos = new THREE.Vector3();

        function animate() {
            requestAnimationFrame(animate);

            platforms.forEach(p => {
                if(p.active && p.mesh.scale.x < 1) p.mesh.scale.lerp(new THREE.Vector3(1,1,1), 0.1);
            });

            if(!gamePaused) {
                let mX = 0, mZ = 0;
                // Controles absolutos para facilitar el parkour en móvil
                if(keys.w) mZ -= physics.speed;
                if(keys.s) mZ += physics.speed;
                if(keys.a) mX -= physics.speed;
                if(keys.d) mX += physics.speed;

                physics.vel.x = mX; physics.vel.z = mZ; physics.vel.y += physics.grav;
                player.position.add(physics.vel);

                const px = player.position.x, pz = player.position.z, py = player.position.y - 1;
                let floorY = -9999;
                let landedIndex = -1;

                // Hitboxes aumentadas (+1.0) para evitar traspasar
                platforms.forEach((p, i) => {
                    if(!p.active || p.world !== currentWorld) return;
                    p.mesh.getWorldPosition(pos);
                    if(px >= pos.x - p.w/2 - 1.0 && px <= pos.x + p.w/2 + 1.0 &&
                       pz >= pos.z - p.d/2 - 1.0 && pz <= pos.z + p.d/2 + 1.0) {
                        const top = pos.y + p.yTop;
                        if(py <= top && py >= top - 2.5) { // Tolerancia vertical aumentada
                            floorY = top;
                            landedIndex = i;
                        }
                    }
                });

                if(floorY !== -9999 && physics.vel.y <= 0) {
                    player.position.y = floorY + 1;
                    physics.vel.y = 0;
                    physics.jumps = 2; 
                    
                    if(currentWorld === 1 && landedIndex >= highestPlatIndex) {
                        highestPlatIndex = landedIndex;
                        activatePlatform(highestPlatIndex + 1);
                        activatePlatform(highestPlatIndex + 2); 
                    }
                }

                if(player.position.y < (currentWorld === 1 ? -40 : -320)) {
                    player.position.set(0, currentWorld === 1 ? 5 : -240, currentWorld === 1 ? 0 : -80);
                    physics.vel.set(0,0,0);
                }

                if(currentWorld === 1) {
                    memories.forEach(m => {
                        m.mesh.rotation.y += 0.05; m.mesh.rotation.x += 0.02;
                        // Radio de recolección gigante (distancia < 6)
                        if(m.mesh.visible && !m.collected && player.position.distanceTo(m.mesh.position) < 6) {
                            m.collected = true; m.mesh.visible = false;
                            score++; document.getElementById('score').innerText = score;
                            openMsg(m.data);
                        }
                    });
                }
            }

            particles.rotation.y += 0.001;
            
            // --- EFECTO DE CÁMARA DINÁMICA (TRAILING) ---
            let targetCamX = player.position.x;
            let targetCamY = player.position.y + 7;
            let targetCamZ = player.position.z + 18;

            // Inclinación/Lag de cámara basado en velocidad lateral
            if(Math.abs(physics.vel.x) > 0.01) {
                targetCamX -= physics.vel.x * 25; // Se aleja en contra del movimiento
            }
            if(physics.vel.y > 0) {
                targetCamY -= physics.vel.y * 5; // Baja sutilmente al saltar
            }

            camera.position.lerp(new THREE.Vector3(targetCamX, targetCamY, targetCamZ), 0.08);
            camera.lookAt(player.position.x, player.position.y + 2, player.position.z - 5);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
